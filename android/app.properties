# إعدادات بناء تطبيقات أندرويد (تُقرأ في app/build.gradle)
# عنوان النظام الذي يفتحه التطبيق
BASE_URL=https://3.iajaward.org
#
# الأسرار ليست هنا (المستودع عام): تأتي من أسرار GitHub في Actions —
#   ANDROID_KEYSTORE_B64      ملف مفتاح التوقيع release.jks بصيغة base64
#   ANDROID_KEYSTORE_PASSWORD كلمة مرور المفتاح
#   ANDROID_KEY_ALIAS         اسم المفتاح (attendance)
#   ATT_APP_KEY               مفتاح توقيع حركات تطبيق الموظف = MOBILE_APP_KEY في .env على الخادم
# وللبناء على جهاز محلي: ملف android/signing.properties (لا يُرفع) بالمفاتيح KEYSTORE_FILE وKEYSTORE_PASSWORD وKEY_ALIAS وAPP_KEY.

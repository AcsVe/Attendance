{% include '_i18n.html' %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest-me.json?v={{ icon_ver }}">
  <meta name="theme-color" content="#1B6E8C">
  <link rel="icon" type="image/png" sizes="32x32" href="/app-icon/32.png?v={{ icon_ver }}">
  <link rel="apple-touch-icon" href="/app-icon/180.png?v={{ icon_ver }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Check-in">
  <meta name="mobile-web-app-capable" content="yes">
  <script>(function(){try{var t=localStorage.getItem('att_theme');if(t==='dark'||(t===null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <style>
    :root{--p:#1B6E8C;--pd:#124A5F;--pl:#4FA3C0;--s:#2E4E7A;--bg:#f0f4f5;--t:#1e2a2b;--m:#6b7c7e;--b:#d4e4e6;--ok:#1e8e5a;--warn:#d9822b;--bad:#c0392b;--card:#fff;--chip:#eef4f6}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;-webkit-tap-highlight-color:transparent}
    .wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
    .card{background:var(--card);border-radius:16px;box-shadow:0 2px 14px rgba(27,110,140,.10);padding:16px;margin-bottom:12px}
    .btn{border:0;border-radius:12px;font:700 1rem 'Tajawal',sans-serif;padding:13px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn-p{background:var(--p);color:#fff}.btn-l{background:var(--chip);color:var(--pd)}
    input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--b);border-radius:12px;font:500 1rem 'Tajawal',sans-serif;background:var(--card);color:var(--t)}
    input:focus{outline:none;border-color:var(--p)}
    label{display:block;font-weight:700;font-size:.9rem;margin:10px 0 6px;color:var(--pd)}
    .muted{color:var(--m);font-size:.86rem}
    .err{background:#fdecea;color:var(--bad);border-radius:12px;padding:11px 13px;font-weight:700;font-size:.92rem;margin:10px 0}
    :root[data-theme="dark"]{--bg:#0f1719;--card:#172225;--t:#e6edee;--m:#93a7a9;--b:#2a3a3d;--pd:#79c3dc;--pl:#6fb9d2;--chip:#10191b}
    :root[data-theme="dark"] .tw thead th{background:#13201f}
    :root[data-theme="dark"] .tabs button{background:#10191b;color:var(--t)}
    :root[data-theme="dark"] .kpi div{background:#10191b}
    :root[data-theme="dark"] .top h1,:root[data-theme="dark"] label,:root[data-theme="dark"] .card b{color:var(--pd)}
    body.has-ticker{padding-top:38px}body.has-ticker .theme-toggle[style*="position:fixed"]{top:50px!important}   /* الشريط الإعلاني (templates/_ticker.html) ثابت أعلى الشاشة بارتفاع 38px */
    .theme-toggle{background:none;border:1.5px solid var(--b);color:var(--t);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:1.1rem}
  </style>

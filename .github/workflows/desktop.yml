# نسخة سطح المكتب (AttendanceDesktopSetup.exe): خيار إضافي يعمل على كمبيوتر واحد دون خادم، يُبنى مع كل رفع إلى main.
# يُبنى على Python 3.12 لويندوز، ثم يُفحص البرنامج المبني نفسه (--selftest: الدخول ولوحة التحكم على قاعدة مؤقتة)،
# ثم يُنشر المثبّت في مستودع التحميلات العام.
name: Desktop edition (AttendanceDesktopSetup.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml', 'requirements.txt']

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pyinstaller==6.11.1
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(date -u +%Y.%-m.%-d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: pyinstaller desktop/AttendanceDesktop.spec --noconfirm
      - name: Self-test of the built program
        timeout-minutes: 5
        shell: pwsh
        run: |
          dist\AttendanceDesktop\AttendanceDesktop.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.v.outputs.version }}" desktop\AttendanceDesktop.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: AttendanceDesktopSetup, path: dist/AttendanceDesktopSetup.exe, retention-days: 3 }
      - name: Publish to the fixed download link
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          gh release view ${PFX}desktop >/dev/null 2>&1 || gh release create ${PFX}desktop --title "الحضور والانصراف — نسخة سطح المكتب" --notes "تتحدّث تلقائياً مع كل بناء. حمِّل AttendanceDesktopSetup.exe وشغّله؛ لا يحتاج صلاحيات المسؤول."
          gh release upload ${PFX}desktop dist/AttendanceDesktopSetup.exe --clobber
        env:
          # DOWNLOADS_TOKEN (رمز بصلاحية الكتابة على AcsVe/downloads): يُنشر الملف في مستودع التحميلات العام
          # بوسم يبدأ باسم النظام؛ وبدونه يُنشر هنا
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN || github.token }}
          GH_REPO: ${{ secrets.DOWNLOADS_TOKEN && 'AcsVe/downloads' || github.repository }}
          PFX: ${{ secrets.DOWNLOADS_TOKEN && 'attendance-' || '' }}

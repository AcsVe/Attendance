# الفحص الآلي مع كل رفع إلى main: كل ملفات Python تُترجم على Python 3.10 (نسخة كمبيوتر المدرسة أقدم من 3.12؛
# صيغة غير مدعومة توقف النظام بالخطأ 502)، ثم فحص المظهر لكل التبويبات وتطبيق الموظف وشاشات العرض بالعربية
# والإنجليزية على الحاسوب والهاتف (أخطاء JavaScript، التباين، الخط الصغير، اتجاه النص، النصوص غير المترجمة).
# إن فشل وصل إشعار بالبريد إلى صاحب المستودع.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_CHANNEL: chromium
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Python 3.10 syntax
        run: python -m compileall -q $(git ls-files '*.py')
      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: UI audit
        run: python tests/ui_audit.py
